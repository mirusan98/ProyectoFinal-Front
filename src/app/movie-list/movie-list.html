<section class="movies-container">
  <h2>Lista de películas</h2>

  <div *ngFor="let movie of movies">
  <app-movie-item
    [movie]="movie"
    (movieSelected)="onMovieSelected(movie)">
  </app-movie-item>
</div>
<!--para mostrar las pelis-->
  <div class="selected">
    <h3 *ngIf="movieSelected">
      <p class="selectBold"> Se selecciono: {{ movieSelected }}</p>
    </h3>
    <h3 *ngIf="!movieSelected">
      <p>Hay que seleccionar una pelicula</p>
    </h3>
  </div>
</section>
